name: verify-native-vercel-backend

on:
  push:
    branches:
      - vercel-native-clean-2026-09-30
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit --ignoreConfig --target ES2022 --module NodeNext --moduleResolution NodeNext --types node --allowJs --skipLibCheck api/internal/cron.ts
      - name: Verify no Express dependency or source import
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Express references in runtime source ==="
          if grep -Rniw "express" src api package.json --include='*.ts' --include='*.mts' --include='*.cts' --include='*.json'; then
            echo "Express reference found."
            exit 1
          fi

          if grep -RniE 'express-compat|express-rate-limit|cookie-parser|helmet|multer' src api package.json --include='*.ts' --include='*.mts' --include='*.cts' --include='*.json'; then
            echo "Legacy Express-related reference found."
            exit 1
          fi

          if npm ls express --depth=0 >/dev/null 2>&1; then
            echo "Express is installed as a direct dependency."
            exit 1
          fi

          echo "Native Vercel backend verification passed."
